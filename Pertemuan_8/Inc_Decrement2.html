<HTML>
<HEAD>
<TITLE>Operasi ++ dan --</TITLE>
</HEAD>
<BODY>
<SCRIPT LANGUAGE = "JavaScript">
    a = 5;
    b = 8;
    
    hslJml = b - a++;// 8-5 = 3, a=6
    document.write("1. Hasil jumlah dengan a++ = " + hslJml);
    document.write("<BR>");
    
    hslJml1 = b - ++a;
    document.write("2. Hasil jumlah dengan ++a = " + hslJml1);
    document.write("<BR>");
    
    hslKrg = b - a--;
    document.write("3. Hasil kurang dengan a++ = " + hslKrg);
    document.write("<BR>");
</SCRIPT>
</BODY>
</HTML>
