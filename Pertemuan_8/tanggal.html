<HTML>
<HEAD>
<TITLE>Tanggal dan waktu Menggunakan Array</TITLE>
<SCRIPT LANGUAGE = "JavaScript">
    var waktu = new Date();
    var hari = new Array ("Minggu", "Senin", "Selasa",
                           "Rabu", "kamis", "Jumat", "Sabtu")
    var bulan = new Array ("Januari", "Februari", "Maret", "April",
                           "Mei", "Juni", "Juli", "Agustus", "September",
                           "Oktober", "November", "Desember")

    document.write ("Hari ini : " + hari[waktu.getDay()] + ", " +
                    waktu.getDate() + " " + bulan[waktu.getMonth()] + " " +
                    waktu.getFullYear()) ;
</SCRIPT>
</HEAD>
<BODY>
</BODY>
</HTML>
