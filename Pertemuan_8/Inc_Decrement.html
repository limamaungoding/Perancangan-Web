<HTML>
<HEAD>
<TITLE> Increment dan Decrement </TITLE>
</HEAD>
<BODY>
<SCRIPT LANGUAGE = "JavaScript">
    a = 3;
    b = 6 + a++;
    document.write("1. b = " + b + "<br />");
    
    a = 3;
    b = 6 + ++a;
    document.write("2. b = " + b + "<br />");
    
    a = 3;
    b = 6 + a--;
    document.write("3. b = " + b + "<br />");
    
    a = 3;
    b = 6 + --a;
    document.write("4. b = " + b + "<br />");
</SCRIPT>
</BODY>
</HTML>
